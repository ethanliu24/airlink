syntax = "proto3";

import "google/protobuf/timestamp.proto";

option go_package = "airlink/internal/transfer/models";

message TransferRequest {
	string id = 1;
	uint32 protocol_version = 2;

	string filename = 3;
	string extension = 4;
	uint64 file_size = 5;
	google.protobuf.Timestamp created_at = 6;
	google.protobuf.Timestamp modified_at = 7;
	string mime = 8;

	string sender_ip = 9;
	string sender_name = 10;
	string client_name = 11;
	string client_version = 12;
}
